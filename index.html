<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Sales Harian CC21</title>
<style>
body{font-family:Arial;background:#eef2ff;margin:0;padding:12px}
.box{max-width:800px;margin:10px auto;background:#fff;padding:16px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h2{text-align:center;margin:0 0 8px;color:#2563eb}
h3{margin:16px 0 8px;border-left:4px solid #2563eb;padding-left:8px;font-size:14px}
label{display:block;margin-top:8px;font-weight:600;font-size:13px}
input,select,button,textarea{width:100%;padding:12px;margin-top:4px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
button{background:#25D366;color:#fff;border:none;margin-top:12px;font-weight:bold;cursor:pointer}
.btn2{background:#2563eb}.btn3{background:#f59e0b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section{background:#f8fafc;padding:10px;border-radius:8px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;font-size:12px;margin-bottom:4px;align-items:center}
.row input{padding:6px}
#preview{white-space:pre-wrap;background:#111;color:#0f0;padding:12px;border-radius:8px;display:none;margin-top:10px;font-size:12px;max-height:300px;overflow:auto}
@media (max-width: 600px){.grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="box">
  <h2>REPORT SALES HARIAN</h2>

  <div class="grid"><div><label>PERIODE</label><input id="period" type="date"></div><div><label>SHIFT</label><select id="shift"><option>1</option><option>2</option><option>3</option></select></div></div>
  <div class="grid"><div><label>WH</label><input id="wh" value="Bekasi"></div><div><label>AM</label><input id="am" value="Syahrul"></div></div>
  <div class="grid"><div><label>AC</label><input id="ac" value="Triyanto"></div></div>
  
  <div class="grid"><div><label>KD Toko</label><input id="storeCode" placeholder="CC21"></div><div><label>Nama Toko</label>
