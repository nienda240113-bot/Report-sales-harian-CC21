<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Report CC21">
<title>Report Sales Harian CC21</title>
<link rel="apple-touch-icon" href="https://img.icons8.com/color/192/report-card.png">
<style>
* {box-sizing: border-box; -webkit-tap-highlight-color: transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f4f4;margin:0;padding:12px}
.login-box,.app-box{max-width:850px;margin:10px auto;background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{text-align:center;margin:0 0 10px;font-size:18px}
h3{margin-top:16px;border-bottom:2px solid #2563eb;padding-bottom:4px;font-size:15px}
label{display:block;margin-top:8px;font-weight:bold;font-size:13px}
input,select,button,textarea{width:100%;padding:12px;margin-top:4px;border:1px solid #ccc;border-radius:10px;font-size:16px} /* 16px biar ga zoom di iPhone */
button{background:#2563eb;color:#fff;border:none;margin-top:12px;cursor:pointer;font-weight:bold;min-height:44px}
button:hover{background:#1d4ed8}
button.green{background:#16a34a}
button.whatsapp{background:#25D366}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{margin-top:12px;text-align:center;font-size:14px;font-weight:bold}
.hidden{display:none}
.section{background:#f8fafc;padding:10px;border-radius:8px;margin-top:10px;overflow-x:auto}
.small-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;align-items:center;font-size:12px}
.small-grid input{padding:6px;font-size:13px}
.preview-box{background:#dcf8c6;padding:12px;border-radius:10px;margin-top:10px;border:1px solid #25D366;white-space:pre-wrap;font-family:monospace;font-size:12px;max-height:400px;overflow-y:auto}
@media (max-width: 600px){ .grid{grid-template-columns:1fr} } /* 1 kolom di HP kecil */
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h2>Login Sales</h2>
  <label>Kode Toko</label>
  <input id="storeCodeLogin" type="text" placeholder="Contoh: CC21" style="text-transform:uppercase" autocomplete="off" />
  <label>Nama Sales</label>
  <input id="namaSalesLogin" type="text" placeholder="Nama kamu" autocomplete="name" />
  <button id="loginBtn">MASUK</button>
</div>

<div id="app" class="app-box hidden">
  <h2>REPORT SALES HARIAN</h2>
  <p id="who" style="text-align:center;color:#2563eb;font-weight:bold;font-size:13px"></p>
  
  <div class="grid"><div><label>PERIODE</label><input id="period" type="date"></div><div><label>SHIFT</label><select id="shift"><option>1</option><option>2</option><option>3</option></select></div></div>
  <div class="grid"><div><label>WH</label><input id="wh" type="text" value="Bekasi"></div><div><label>AM</label><input id="am" type="text" value="Syahrul"></div></div>
  <div class="grid"><div><label>AC</label><input id="ac" type="text" value="Triyanto"></div><div><label>KD Toko</label><input id="storeCode" type="text" readonly></div></div>
  <label>Nama Toko</label><input id="storeName" type="text" readonly>

  <h3>*REVENUE*</h3>
  <div class="grid"><div><label>TIME FACTOR %</label><input id="timeFactor" type="number" step="0.01" inputmode="decimal"></div><div><label>TARGET MTD Rp</label><input id="targetMTD" type="number" inputmode="numeric"></div></div>
  <div class="grid"><div><label>ACTUAL Rp</label><input id="actual" type="number" inputmode="numeric"></div><div><label>FEE BASE Rp</label><input id="feeBase" type="number" inputmode="numeric"></div></div>

  <h3>*FOKUS CABANG*</h3>
  <div class="section">
    <div class="small-grid"><b>Nama</b><b>Target</b><b>Sales</b><b>OH</b></div>
    <div class="small-grid"><span>TEBUS MURAH</span><input id="tm_target" type="number"><input id="tm_sales" type="number"><input id="tm_oh" type="number"></div>
    <div class="small-grid"><span>SERBA GRATIS</span><input id="sg_target" type="number"><input id="sg_sales" type="number"><input id="sg_oh" type="number"></div>
    <div class="small-grid"><span>SEUUGER</span><input id="seu_target" type="number"><input id="seu_sales" type="number"><input id="seu_oh" type="number"></div>
    <div class="small-grid"><span>PROMO CEBAN</span><input id="pc_target" type="number"><input id="pc_sales" type="number"><input id="pc_oh" type="number"></div>
  </div>

  <h3>*MEMBER*</h3>
  <div class="grid"><div><label>NEW MEMBER</label><input id="newMember" type="number"></div><div><label>Struk MEMBER</label><input id="memberReceipt" type="number"></div></div>
  <label>Total STRUK</label><input id="totalReceipt" type="number">

  <h3>*PSM (In Qty)*</h3>
  <div class="section">
    <div class="small-grid"><b>Produk</b><b>Target</b><b>Actual</b><b>%</b></div>
    <div class="small-grid"><input id="psm1n" value="Le mineral"><input id="psm1t" type="number"><input id="psm1a" type="number"><input id="psm1p" readonly></div>
    <div class="small-grid"><input id="psm2n" value="Nescafe"><input id="psm2t" type="number"><input id="psm2a" type="number"><input id="psm2p" readonly></div>
    <div class="small-grid"><input id="psm3n" value="Happy tos"><input id="psm3t" type="number"><input id="psm3a" type="number"><input id="psm3p" readonly></div>
    <div class="small-grid"><input id="psm4n" value="Sedaap"><input id="psm4t" type="number"><input id="psm4a" type="number"><input id="psm4p" readonly></div>
    <div class="small-grid"><input id="psm5n" value="Roma"><input id="psm5t" type="number"><input id="psm5a" type="number"><input id="psm5p" readonly></div>
    <div class="small-grid"><input id="psm6n" value="Rinso"><input id="psm6t" type="number"><input id="psm6a" type="number"><input id="psm6p" readonly></div>
    <div class="small-grid"><input id="psm7n" value="Kahf"><input id="psm7t" type="number"><input id="psm7a" type="number"><input id="psm7p" readonly></div>
    <div class="small-grid"><input id="psm8n" value="H&S"><input id="psm8t" type="number"><input id="psm8a" type="number"><input id="psm8p" readonly></div>
    <div class="small-grid"><input id="psm9n" value="Colagena"><input id="psm9t" type="number"><input id="psm9a" type="number"><input id="psm9p" readonly></div>
  </div>

  <h3>*CATEGORY*</h3>
  <div class="grid"><div><label>TOYS (NS)</label><input id="toys" type="number"></div><div><label>HBPL (NS)</label><input id="hbpl" type="number"></div></div>

  <button id="saveBtn">💾 Simpan Data</button>
  <button id="previewBtn" class="green">👀 Preview WhatsApp</button>
  <button id="waBtn" class="whatsapp">📲 Kirim ke WhatsApp</button>
  
  <div id="status" class="status"></div>
  <div id="previewWrap" class="hidden">
    <h3>Preview Pesan WA</h3>
    <div id="waPreview" class="preview-box"></div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzD9XY0E8C9CDm1z19-EmwZdT_Zyd4WHILlQpkuYb8dCcGi1D9UpbMK3pBD1YNhFUzj/exec';
const API_TOKEN = 'bc318b0a8cb4498
