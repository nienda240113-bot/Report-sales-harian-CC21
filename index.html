<!-- TOMBOL SIMPAN MELAYANG -->
<style>
  #btnSimpanCC21 {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    border: none;
    border-radius: 50px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    z-index: 9999;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #btnSimpanCC21:active {
    transform: scale(0.95);
  }
  @media (max-width: 768px) {
    #btnSimpanCC21 { bottom: 80px; } /* biar ga ketutup navbar HP */
  }
</style>

<button id="btnSimpanCC21">💾 Simpan Data</button>

<!-- LIB CSV -->
<script>
(function() {
  const btn = document.getElementById('btnSimpanCC21');

  function downloadCSV(csv, filename) {
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function tableToCSV(table) {
    const rows = [];
    for (let i = 0; i < table.rows.length; i++) {
      const cols = [];
      for (let j = 0; j < table.rows[i].cells.length; j++) {
        cols.push('"' + table.rows[i].cells[j].innerText.replace(/"/g, '""') + '"');
      }
      rows.push(cols.join(","));
    }
    return rows.join("\n");
  }

  btn.addEventListener('click', function() {
    const tables = document.querySelectorAll("table");
    if (tables.length === 0) {
      alert("Tabel tidak ditemukan di halaman");
      return;
    }

    const tanggal = new Date().toISOString().slice(0,10);

    if (tables.length === 1) {
      // Kalau cuma 1 tabel langsung download
      const csv = tableToCSV(tables[0]);
      downloadCSV(csv, `Report-CC21-${tanggal}.csv`);
    } else {
      // Kalau ada banyak tabel, gabungin jadi 1 file
      let allCSV = "";
      tables.forEach((t, idx) => {
        allCSV += `--- TABEL ${idx+1} ---\n`;
        allCSV += tableToCSV(t) + "\n\n";
      });
      downloadCSV(allCSV, `Report-CC21-Lengkap-${tanggal}.csv`);
    }

    btn.innerText = "✅ Tersimpan";
    setTimeout(() => btn.innerText = "💾 Simpan Data", 2000);
  });
})();
</script>
