<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Sales Harian</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:12px}
.box{max-width:850px;margin:10px auto;background:#fff;padding:16px;border-radius:12px}
h2{text-align:center}
label{display:block;margin-top:8px;font-weight:bold}
input,select,button{width:100%;padding:12px;margin-top:4px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:none;margin-top:12px;font-weight:bold}
.whatsapp{background:#25D366}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none}
.section{background:#f8fafc;padding:10px;border-radius:8px;margin-top:10px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;font-size:12px;margin-bottom:4px}
@media (max-width: 600px){.grid{grid-template-columns:1fr} }
</style>
</head>

<div id="loginScreen" class="box">
  <h2>Login Sales</h2>
  <label>Kode Toko</label>
  <input id="storeCodeLogin" type="text" placeholder="CC21" style="text-transform:uppercase" />
  <label>Nama Sales</label>
  <input id="namaSalesLogin" type="text" placeholder="Nama kamu" />
  <button onclick="login()">MASUK</button>
  <p id="loginError" style="color:red;text-align:center"></p>
</div>

  <div class="grid"><div><label>ACTUAL Rp</label><input id="actual" type="number" value="0"></div><div><label>FEE BASE Rp</label><input id="feeBase" type="number" value="0"></div></div>
