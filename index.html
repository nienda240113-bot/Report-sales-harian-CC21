<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Sales Harian CC21 FINAL</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:16px}
.login-box,.app-box{max-width:850px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{text-align:center;margin:0 0 10px}
h3{margin-top:20px;border-bottom:2px solid #2563eb;padding-bottom:4px;font-size:16px}
label{display:block;margin-top:10px;font-weight:bold;font-size:14px}
input,select,button,textarea{width:100%;padding:10px;margin-top:4px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:14px}
button{background:#2563eb;color:#fff;border:none;margin-top:12px;cursor:pointer;font-weight:bold}
button:hover{background:#1d4ed8}
button.green{background:#16a34a}
button.green:hover{background:#15803d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{margin-top:12px;text-align:center;font-size:14px;font-weight:bold}
.hidden{display:none}
.section{background:#f8fafc;padding:12px;border-radius:8px;margin-top:12px}
.small-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;align-items:center;font-size:13px}
.small-grid b{text-align:center}
textarea{height:400px;font-family:monospace;white-space:pre}
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h2>Login Sales</h2>
  <label>Kode Toko</label>
  <input id="storeCodeLogin" type="text" placeholder="Contoh: CC21" style="text-transform:uppercase" />
  <label>Nama Sales</label>
  <input id="namaSalesLogin" type="text" placeholder="Nama kamu" />
  <button id="loginBtn">MASUK</button>
</div>

<div id="app" class="app-box hidden">
  <h2>REPORT SALES HARIAN</h2>
  <p id="who" style="text-align:center;color:#2563eb;font-weight:bold"></p>
  
  <div class="grid">
    <div><label>PERIODE</label><input id="period" type="date"></div>
    <div><label>SHIFT</label><select id="shift"><option>1</option><option>2</option><option>3</option></select></div>
  </div>
  <div class="grid">
    <div><label>WH</label><input id="wh" type="text" value="Bekasi"></div>
    <div><label>AM</label><input id="am" type="text" value="Syahrul"></div>
  </div>
  <div class="grid">
    <div><label>AC</label><input id="ac" type="text" value="Triyanto"></div>
    <div><label>KD Toko</label><input id="storeCode" type="text" readonly></div>
  </div>
  <label>Nama Toko</label><input id="storeName" type="text"
