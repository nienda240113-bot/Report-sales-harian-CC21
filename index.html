<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Sales Harian CC21 Final</title>
<style>
body{font-family:sans-serif;background:#f4f4f4;margin:0;padding:16px}
.login-box,.app-box{max-width:800px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{text-align:center;margin:0 0 10px}
h3{margin-top:20px;border-bottom:2px solid #2563eb;padding-bottom:4px}
label{display:block;margin-top:10px;font-weight:bold;font-size:14px}
input,select,button{width:100%;padding:10px;margin-top:4px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:none;margin-top:16px;cursor:pointer;font-weight:bold}
button:hover{background:#1d4ed8}
button.secondary{background:#6b7280}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{margin-top:12px;text-align:center;font-size:14px;font-weight:bold}
.hidden{display:none}
.section{background:#f8fafc;padding:12px;border-radius:8px;margin-top:12px}
.small-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;font-size:12px}
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h2>Login Sales</h2>
  <label>Kode Toko</label>
  <input id="storeCodeLogin" type="text" placeholder="Contoh: CC21" style="text-transform:uppercase" />
  <label>Nama Sales</label>
  <input id="namaSalesLogin" type="text" placeholder="Nama kamu" />
  <button id="loginBtn">MASUK</button>
</div>

<div id="app" class="app-box hidden">
  <h2>REPORT SALES HARIAN</h2>
  <p id="who" style="text-align:center;color:#2563eb;font-weight:bold"></p>
  
  <div class="grid">
    <div><label>PERIODE</label><input id="period" type="date"></div>
    <div><label>SHIFT</label><select id="shift"><option>1</option><option>2</option><option>3</option></select></div>
  </div>
  <div class="grid">
    <div><label>WH</label><input id="wh" type="text" value="Bekasi"></div>
    <div><label>AM</label><input id="am" type="text" value="Syahrul"></div>
  </div>
  <div class="grid">
    <div><label>AC</label><input id="ac" type="text" value="Triyanto"></div>
    <div><label>KD Toko</label><input id="storeCode" type="text" readonly></div>
  </div>
  <label>Nama Toko</label><input id="storeName" type="text" readonly>

  <h3>*REVENUE*</h3>
  <div class="grid">
    <div><label>TIME FACTOR %</label><input id="timeFactor" type="number" step="0.01" value="87.10"></div>
    <div><label>TARGET MTD Rp</label><input id="targetMTD" type="number" value="345059891"></div>
  </div>
  <div class="grid">
    <div><label>ACTUAL Rp</label><input id="actual" type="number" value="4646000"></div>
    <div><label>FEE BASE Rp</label><input id="feeBase" type="number" value="25000"></div>
  </div>

  <h3>*FOKUS CABANG*</h3>
  <div class="section">
    <div class="small-grid"><b>Nama</b><b>Target</b><b>Sales</b><b>On Hand</b></div>
    <div class="small-grid"><span>TEBUS MURAH</span><input id="tm_target" value="20"><input id="tm_sales" value="21"><input id="tm_oh" value="0"></div>
    <div class="small-grid"><span>SERBA GRATIS</span><input id="sg_target" value="17"><input id="sg_sales" value="8"><input id="sg_oh" value="0"></div>
    <div class="small-grid"><span>SEUUGER</span><input id="seu_target" value="40"><input id="seu_sales" value="4"><input id="seu_oh" value="0"></div>
    <div class="small-grid"><span>PROMO CEBAN</span><input id="pc_target" value="69"><input id="pc_sales" value="1"><input id="pc_oh" value="0"></div>
  </div>

  <h3>*MEMBER*</h3>
  <div class="grid">
    <div><label>Actual NEW MEMBER</label><input id="newMember" type="number" value="0"></div>
    <div><label>Struk MEMBER</label><input id="memberReceipt" type="number" value="47"></div>
  </div>
  <label>Total STRUK</label><input id="totalReceipt" type="number" value="69">

  <h3>*PSM (In Qty)*</h3>
  <div class="section">
    <div class="small-grid"><b>Produk</b><b>Target</b><b>Actual</b></div>
    <div class="small-grid"><span>Le mineral</span><input id="psm1t" value="210"><input id="psm1a" value="8"></div>
    <div class="small-grid"><span>Nescafe</span><input id="psm2t" value="75"><input id="psm2a" value="6"></div>
    <div class="small-grid"><span>Happy tos</span><input id="psm3t" value="33"><input id="psm3a" value="1"></div>
    <div class="small-grid"><span>Sedaap</span><input id="psm4t" value="66"><input id="psm4a" value="10"></div>
    <div class="small-grid"><span>Roma</span><input id="psm5t" value="45"><input id="psm5a" value="3"></div>
    <div class="small-grid"><span>Rinso</span><input id="psm6t" value="17"><input id="psm6a" value="18"></div>
    <div class="small-grid"><span>Kahf</span><input id="psm7t" value="24"><input id="psm7a" value="0"></div>
    <div class="small-grid"><span>H&S</span><input id="psm8t" value="12"><input id="psm8a" value="0"></div>
    <div class="small-grid"><span>Colagena</span><input id="psm9t" value="55"><input id="psm9a" value="0"></div>
  </div>

  <h3>*CATEGORY*</h3>
  <div class="grid">
    <div><label>TOYS (NS) Rp</label><input id="toys" type="number" value="0"></div>
    <div><label>HBPL (NS) Rp</label><input id="hbpl" type="number" value="0"></div>
  </div>

  <button id="saveBtn">💾 Simpan Data</button>
  <button id="loadBtn" class="secondary">📋 Lihat Data Tersimpan</button>
  <div id="status" class="status"></div>
  <div id="tableWrap"></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzD9XY0E8C9CDm1z19-EmwZdT_Zyd4WHILlQpkuYb8dCcGi1D9UpbMK3pBD1YNhFUzj/exec';
const API_TOKEN = 'bc318b0a8cb4498dba48b232e8f6a461';
const STORE_LIST = {"C624":"TOKO C624","C560":"TOKO C560","CH81":"TOKO CH81","CG76":"TOKO CG76","C573":"TOKO C573","CE47":"TOKO CE47","CA71":"TOKO CA71","CI30":"TOKO CI30","CH41":"TOKO CH41","CG54":"TOKO CG54","C935":"TOKO C935","C965":"TOKO C965","CG86":"TOKO CG86","CA94":"TOKO CA94","C574":"TOKO C574","CI15":"TOKO CI15","CI54":"TOKO CI54","CF50":"TOKO CF50","CC21":"TOKO CC21 KUTN","CI84":"TOKO CI84"};
let state = { user: null };
document.getElementById('loginBtn').onclick = login;
document.getElementById('saveBtn').onclick = saveReport;
function login(){ const code = document.getElementById('storeCodeLogin').value.trim().toUpperCase(); const nama = document.getElementById('namaSalesLogin').value.trim(); if(!code ||!nama) return alert("Isi Kode Toko dan Nama Sales"); if(!STORE_LIST[code]) return alert("Kode Toko tidak terdaftar"); state.user = { code: code, storeName: STORE_LIST[code], namaSales: nama }; document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); document.getElementById('who').textContent = `${state.user.storeName} - ${state.user.namaSales}`; document.getElementById('storeCode').value = code; document.getElementById('storeName').value = STORE_LIST[code]; document.getElementById('period').value = new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function saveReport(){ 
  const targetTF = Math.round(+targetMTD.value * +timeFactor.value / 100);
  const achieve = (+actual.value / +targetMTD.value * 100).toFixed(2);
  const achTF = (+actual.value / targetTF * 100).toFixed(2);
  const gap = +targetMTD.value - +actual.value;
  const gapTF = targetTF - +actual.value;
  const memberPct = (+memberReceipt.value / +totalReceipt.value * 100).toFixed(0);

  const data = {
    id: uid(), Timestamp: new Date(), period: period.value, storeCode: state.user.code, storeName: state.user.storeName, namaSales: state.user.namaSales,
    wh: wh.value, am: am.value, ac: ac.value, shift: shift.value,
    timeFactor: +timeFactor.value, targetMTD: +targetMTD.value, targetTF, actual: +actual.value, achieve, achTF, gap, gapTF,
    newMember: +newMember.value, memberReceipt: +memberReceipt.value, totalReceipt: +totalReceipt.value, memberPct,
    toys: +toys.value, hbpl: +hbpl.value, feeBase: +feeBase.value,
    fokus: {tm:[+tm_target.value,+tm_sales.value,+tm_oh.value], sg:[+sg_target.value,+sg_sales.value,+sg_oh.value], seu:[+seu_target.value,+seu_sales.value,+seu_oh.value], pc:[+pc_target.value,+pc_sales.value,+pc_oh.value]},
    psm: [[+psm1t.value,+psm1a.value],[+psm2t.value,+psm2a.value],[+psm3t.value,+psm3a.value],[+psm4t.value,+psm4a.value],[+psm5t.value,+psm5a.value],[+psm6t.value,+psm6a.value],[+psm7t.value,+psm7a.value],[+psm8t.value,+psm8a.value],[+psm9t.value,+psm9a.value]]
  };
  document.getElementById('status').innerHTML = '⏳ Menyimpan...';
  callAPI('save', {data: JSON.stringify(data)}, res => {
    document.getElementById('status').innerHTML = res.ok? '🟢 Tersimpan online' : '🔴 Gagal: '+res.error;
  });
}
function callAPI(action, params, cb){ params.action = action; params.token = API_TOKEN; const callback = 'cb_'+Date.now(); window[callback] = cb; params.callback = callback; const s = document.createElement('script'); s.src = API_URL+'?'+new URLSearchParams(params).toString(); document.head.appendChild(s); }
</script>
</body>
</html>
