<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Report Sales</title><style>body{font-family:Arial;background:#f4f4f4;padding:20px}.box{max-width:400px;margin:50px auto;background:#fff;padding:20px;border-radius:12px}input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc;font-size:16px}button{background:#2563eb;color:#fff;border:none;font-weight:bold}.hidden{display:none}</style></head><body><div id="login" class="box"><h2>Login Sales</h2><input id="kode" placeholder="KODE TOKO: CC21" style="text-transform:uppercase"><input id="nama" placeholder="NAMA SALES"><button onclick="masuk()">MASUK</button><p id="err" style="color:red"></p></div><div id="app" class="box hidden"><h2>BERHASIL LOGIN!</h2><p id="who"></p></div><script>const TOKO = {"CC21":"TOKO CC21 KUTN","C624":"TOKO C624"};function masuk(){const k = document.getElementById('kode').value.trim().toUpperCase();const n = document.getElementById('nama').value.trim();document.getElementById('err').innerText = '';if(!k ||!n){ document.getElementById('err').innerText = 'Isi semua'; return; }if(!TOKO[k]){ document.getElementById('err').innerText = 'Kode tidak ada: ' + k; return; }document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').innerText = TOKO[k] + ' - ' + n;}</script></body></html>
