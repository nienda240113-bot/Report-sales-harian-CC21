<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Sales Harian</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:12px}
.box{max-width:850px;margin:10px auto;background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{text-align:center;margin:0 0 10px}
h3{margin-top:16px;border-bottom:2px solid #2563eb;padding-bottom:4px;font-size:15px}
label{display:block;margin-top:8px;font-weight:bold;font-size:13px}
input,select,button{width:100%;padding:12px;margin-top:4px;border:1px solid #ccc;border-radius:10px;font-size:16px;box-sizing:border-box}
button{background:#25D366;color:#fff;border:none;margin-top:15px;font-weight:bold;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section{background:#f8fafc;padding:10px;border-radius:8px;margin-top:10px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;font-size:12px;margin-bottom:4px}
@media (max-width: 600px){.grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="box">
  <h2>REPORT SALES HARIAN</h2>

  <div class="grid"><div><label>PERIODE</label><input id="period" type="date"></div><div><label>SHIFT</label><select id="shift"><option>1</option><option>2</option><option>3</option></select></div></div>
  <div class="grid"><div><label>WH</label><input id="wh" value="Bekasi"></div><div><label>AM</label><input id="am" value="Syahrul"></div></div>
  <div class="grid"><div><label>AC</label><input id="ac" value="Triyanto"></div></div>
  
  <div class="grid"><div><label>KD Toko</label><input id="storeCode" placeholder="CC21" style="text-transform:uppercase"></div><div><label>Nama Toko</label><input id="storeName" placeholder="KUTN"></div></div>
  <small style="color:gray">Isi KD Toko: C624,RWBT C560,RAJ CH81,CDKS CG76,SPMM C573,GMM CE47,MKRI CI30,STTD CH41,KPMRK CG54,MM2100 C935,TLJ2 CA71,WSGN C965,CBNU CG86,JKST CA94,KPTI C574,SKU CI15,RPSU CI54,RJLB CF50,DNIA CC21,KUTN CI84,TLKW</small>

  <h3>*REVENUE*</h3>
  <div class="grid"><div><label>TIME FACTOR %</label><input id="timeFactor" type="number" value="87.10"></div><div><label>TARGET MTD Rp</label><input id="targetMTD" type="number" value="0"></div></div>
  <div class="grid"><div><label>ACTUAL Rp</label><input id="actual" type="number" value="0"></div><div><label>FEE BASE Rp</label><input id="feeBase" type="number" value="0"></div></div>

  <h3>*FOKUS CABANG*</h3>
  <div class="section">
    <div class="row"><b>Nama</b><b>Target</b><b>Sales</b><b>OH</b></div>
    <div class="row"><span>TEBUS MURAH</span><input id="tm_t" type="number" value="0"><input id="tm_s" type="number" value="0"><input id="tm_o"
